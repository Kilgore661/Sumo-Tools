<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lucide control icon preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      background: #111;
      color: #eee;
      margin: 2rem;
    }

    table {
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th,
    td {
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.45rem 0.65rem;
      text-align: center;
      vertical-align: middle;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .box {
      align-items: center;
      background: #222;
      display: inline-flex;
      height: 24px;
      justify-content: center;
      outline: 1px solid rgba(255, 255, 255, 0.18);
      width: 24px;
    }

    svg {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .size-18 svg {
      height: 18px;
      width: 18px;
    }

    .size-20 svg {
      height: 20px;
      width: 20px;
    }

    .weight-175 svg {
      stroke-width: 1.75;
    }

    .weight-2 svg {
      stroke-width: 2;
    }
  </style>
</head>
